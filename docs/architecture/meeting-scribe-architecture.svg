<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Meeting Scribe architecture</title><desc id="desc">A local-first, consent-aware core between operator controls, optional Discord and STT adapters, and local event storage and exports.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#18284f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/><text x="92" y="112" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="54" font-weight="700">Meeting Scribe</text><text x="94" y="157" fill="#a9b8d8" font-family="Arial, sans-serif" font-size="25">Consent-aware meeting records with a standalone, local-first core</text>
<g font-family="Arial, sans-serif"><rect x="90" y="250" width="300" height="160" rx="24" fill="#18243f" stroke="#45628f" stroke-width="2" filter="url(#shadow)"/><text x="125" y="310" fill="#7dd3fc" font-size="18" font-weight="700">OPERATOR SURFACE</text><text x="125" y="350" fill="#fff" font-size="30" font-weight="700">Local console</text><text x="125" y="383" fill="#c8d4ef" font-size="21">Room · provider · review</text>
<rect x="90" y="550" width="300" height="160" rx="24" fill="#18243f" stroke="#45628f" stroke-width="2" filter="url(#shadow)"/><text x="125" y="610" fill="#fbbf24" font-size="18" font-weight="700">OPTIONAL ADAPTER</text><text x="125" y="650" fill="#fff" font-size="30" font-weight="700">Discord bot</text><text x="125" y="683" fill="#c8d4ef" font-size="21">Allowlisted commands only</text>
<rect x="540" y="310" width="560" height="320" rx="32" fill="#132e38" stroke="#7dd3fc" stroke-width="3" filter="url(#shadow)"/><text x="590" y="385" fill="#7dd3fc" font-size="18" font-weight="700">THE AUTHORITY</text><text x="590" y="428" fill="#fff" font-size="36" font-weight="700">Consent + lifecycle</text><text x="590" y="470" fill="#fff" font-size="36" font-weight="700">policy core</text><text x="590" y="516" fill="#d3ebf4" font-size="22">disclosing → recording → finalized</text><text x="590" y="556" fill="#d3ebf4" font-size="22">append-only evidence · honest warnings</text><text x="590" y="596" fill="#d3ebf4" font-size="22">no automatic capture · no cloud by default</text>
<rect x="1200" y="250" width="310" height="160" rx="24" fill="#18243f" stroke="#45628f" stroke-width="2" filter="url(#shadow)"/><text x="1235" y="310" fill="#a7f3d0" font-size="18" font-weight="700">LOCAL STORAGE</text><text x="1235" y="350" fill="#fff" font-size="30" font-weight="700">SQLite event ledger</text><text x="1235" y="383" fill="#c8d4ef" font-size="21">Meeting state + evidence</text>
<rect x="1200" y="550" width="310" height="160" rx="24" fill="#18243f" stroke="#45628f" stroke-width="2" filter="url(#shadow)"/><text x="1235" y="610" fill="#c4b5fd" font-size="18" font-weight="700">OUTPUT</text><text x="1235" y="650" fill="#fff" font-size="30" font-weight="700">Local exports</text><text x="1235" y="683" fill="#c8d4ef" font-size="21">Markdown + JSON packages</text>
<path d="M390 330 H515" fill="none" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/><path d="M390 630 H485 Q510 630 515 590" fill="none" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/><path d="M1100 410 H1175" fill="none" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)"/><path d="M1100 555 H1145 Q1170 555 1175 600" fill="none" stroke="#c4b5fd" stroke-width="5" marker-end="url(#arrow)"/>
<text x="91" y="804" fill="#a9b8d8" font-size="21">Trust boundary: Discord events, transcript text, and browser input are untrusted. Only the core service may mutate meeting records.</text><text x="91" y="845" fill="#7dd3fc" font-size="20" font-weight="700">Open source • self-hosted • no telemetry by default</text></g></svg>