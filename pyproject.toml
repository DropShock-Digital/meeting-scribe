[project]
name = "meeting-scribe"
version = "0.1.0"
description = "A self-hosted, consent-aware Discord meeting recorder."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "DropShock Digital"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
discord = ["py-cord>=2.8,<3"]
dev = ["httpx>=0.28,<1", "mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
meeting-scribe = "meeting_scribe.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Formatter owns line wrapping; it avoids noisy false positives in API literals.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["discord"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["meeting_scribe.discord_adapter"]
disable_error_code = ["untyped-decorator", "no-untyped-call"]
