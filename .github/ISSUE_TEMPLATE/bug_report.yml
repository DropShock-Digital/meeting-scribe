name: Bug report
description: Report a reproducible Meeting Scribe issue.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include recordings, transcript text, Discord identifiers, tokens, or private deployment details.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction
    validations:
      required: true
