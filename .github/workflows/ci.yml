name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: python scripts/repo_safety_check.py
      - run: docker compose config
