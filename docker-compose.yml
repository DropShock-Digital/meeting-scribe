services:
  meeting-scribe:
    build: .
    image: meeting-scribe:local
    ports:
      - "${MEETING_SCRIBE_HOST_BIND:-127.0.0.1}:8088:8080"
    env_file:
      - path: .env
        required: false
      # Private, non-secret deployment overlay: e.g. a named room catalog.
      # It is ignored by Git and may safely be absent.
      - path: .env.room-catalog
        required: false
    environment:
      MEETING_SCRIBE_DATA_DIR: /data
      MEETING_SCRIBE_BIND_HOST: 0.0.0.0
      MEETING_SCRIBE_PORT: "8080"
    volumes:
      - meeting-scribe-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  meeting-scribe-discord:
    build: .
    image: meeting-scribe:local
    command: ["meeting-scribe", "discord"]
    profiles: ["discord"]
    env_file:
      - path: .env
        required: false
      # Private, non-secret deployment overlay: e.g. a named room catalog.
      # It is ignored by Git and may safely be absent.
      - path: .env.room-catalog
        required: false
    environment:
      MEETING_SCRIBE_DATA_DIR: /data
    volumes:
      - meeting-scribe-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  meeting-scribe-data:
